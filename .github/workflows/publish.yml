name: Publish to npm

# 触发条件：推送 v* 开头的 tag，例如 v1.0.1、v2.3.4
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      # 检出默认分支（main）而不是 detached 的 tag，
      # 这样后续把版本号变更 push 回 main 时才不会因 detached HEAD 失败
      - name: 检出 main 分支
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: 安装依赖
        run: npm ci

      - name: 运行测试（发布前校验）
        run: npm test

      # 自动把版本号改成 tag 对应的版本（去掉前导 v），
      # 这样提交代码时无需手动维护 package.json 版本号
      - name: 同步版本号到 tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Release version: $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          # 同步 server.js 内的版本号
          sed -i "s/version: \"[0-9.]*\"/version: \"$VERSION\"/" server.js

      - name: 发布到 npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish

      # 将 npm version 修改后的 package.json 等提交回仓库，保持本地与 tag 一致
      - name: 提交版本号变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json server.js
          git commit -m "chore: release v${GITHUB_REF_NAME#v}" || echo "无需提交"
          git push origin main
