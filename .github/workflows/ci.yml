name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # 跨平台矩阵：在 macOS / Windows / Ubuntu 上跑测试，
    # 覆盖 engines 声明的最低版本到当前主流 LTS（Node 18/20/22），
    # 提前发现不同操作系统（路径分隔符、npx、换行符等）导致的兼容问题。
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [18, 20, 22]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # 不升级 npm：npm@latest 的 engines 只支持 Node 22+，
      # 在 Node 18/20 上强行升级会导致后续 npm ci 失败。
      # setup-node 自带的 npm（Node 18.16+/20 自带 npm 9+/10）已支持 lockfileVersion 3。
      - name: 安装依赖
        run: npm ci

      - name: 运行测试
        run: npm test
